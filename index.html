<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0b0f;
    --bg2: #131318;
    --bg3: #1c1c24;
    --border: #26262f;
    --text: #e9e9ee;
    --muted: #8a8a96;
    --accent: #7c5cff;
    --accent2: #4a9eff;
    --user: linear-gradient(135deg, #7c5cff, #4a9eff);
  }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  body { display: flex; }

  /* ===== Сайдбар ===== */
  .sidebar {
    width: 240px; background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: margin-left .25s ease, opacity .25s ease;
  }
  body.sidebar-hidden .sidebar {
    margin-left: -240px;
    opacity: 0;
    pointer-events: none;
  }
  .logo {
    padding: 16px 14px 10px; font-size: 15px; font-weight: 700;
    color: #a08cff; display: flex; align-items: center; gap: 6px;
  }
  .logo::before { content: '✦'; font-size: 16px; }
  .new-chat {
    margin: 0 10px 8px; padding: 9px;
    background: var(--bg3); border: 1px solid var(--border);
    color: #c9c2ff; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: .2s;
  }
  .new-chat:hover { border-color: var(--accent); background: #232330; }
  .search {
    margin: 0 10px 8px; padding: 7px 10px;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-size: 12.5px;
    outline: none; transition: .2s;
  }
  .search:focus { border-color: var(--accent); }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .group {
    font-size: 10.5px; text-transform: uppercase; color: #55556a;
    padding: 8px 6px 4px; font-weight: 600; letter-spacing: .3px;
  }
  .chat-item {
    padding: 8px 10px; margin-bottom: 2px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #b8b8c4; transition: .15s;
  }
  .chat-item:hover { background: var(--bg3); }
  .chat-item.active {
    background: var(--bg3); color: #fff;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .chat-item .t {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .x {
    opacity: 0; background: none; border: none; color: #777;
    cursor: pointer; font-size: 15px; padding: 0 3px;
    border-radius: 5px; line-height: 1; transition: .15s;
  }
  .chat-item:hover .x { opacity: 1; }
  .chat-item .x:hover { color: #ff6b6b; background: rgba(255,107,107,.1); }
  .chat-item input {
    flex: 1; background: #1a1a22; border: 1px solid var(--accent);
    color: #fff; font-size: 12.5px; padding: 2px 6px;
    border-radius: 5px; outline: none; min-width: 0; font-family: inherit;
  }

  /* ===== Основная область ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .topbar .group-model {
    display: flex; gap: 6px; align-items: center; flex: 1; min-width: 220px;
  }
  select, .topbar input {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 9px;
    font-size: 13px; outline: none; transition: .2s;
  }
  select { min-width: 190px; cursor: pointer; }
  .topbar input { flex: 1; min-width: 120px; }
  select:focus, .topbar input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.12);
  }
  .btn {
    padding: 9px 14px; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: .2s; white-space: nowrap;
  }
  .btn:hover { background: #232330; border-color: #3a3a48; }
  .icon-only {
    padding: 9px 12px;
    font-size: 16px;
    min-width: 42px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* ===== Сообщения ===== */
  .messages {
    flex: 1; overflow-y: auto; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
  }
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); text-align: center;
  }
  .empty .icon {
    font-size: 56px;
    background: linear-gradient(135deg, #7c5cff, #4a9eff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .empty h3 { font-size: 22px; color: #b8b8c4; font-weight: 600; }
  .empty p { font-size: 14px; max-width: 400px; }
  .msg {
    max-width: 78%; padding: 13px 17px; border-radius: 16px;
    line-height: 1.55; font-size: 14.5px; word-wrap: break-word;
    white-space: pre-wrap; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .msg.user {
    align-self: flex-end; background: var(--user); color: #fff;
    border-bottom-right-radius: 5px;
  }
  .msg.assistant {
    align-self: flex-start; background: var(--bg3);
    border: 1px solid var(--border); border-bottom-left-radius: 5px;
  }
  .msg.error {
    align-self: center; background: #2a1518; border: 1px solid #4a2028;
    color: #ff8080; font-size: 13px; max-width: 90%;
  }
  .msg img {
    max-width: 100%; border-radius: 10px; margin-top: 10px;
    display: block; cursor: pointer;
  }
  .msg .attached { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .msg .attached img { max-width: 130px; max-height: 130px; width: auto; margin: 0; }

  /* ===== Ввод ===== */
  .input-area { padding: 14px 20px 18px; background: var(--bg2); border-top: 1px solid var(--border); }
  .attach-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .attach-preview .thumb {
    position: relative; width: 66px; height: 66px;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
  }
  .attach-preview .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .attach-preview .thumb button {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,.7); color: #fff; border: none;
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .icon-btn {
    width: 44px; height: 44px; flex-shrink: 0;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 11px; cursor: pointer;
    font-size: 18px; transition: .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: #232330; border-color: var(--accent); }
  textarea {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 12px 15px; border-radius: 11px;
    font-size: 14.5px; resize: none; font-family: inherit;
    outline: none; max-height: 160px; line-height: 1.4; transition: .2s;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.12); }
  .send-btn {
    padding: 0 22px; height: 44px; border: none; color: #fff;
    border-radius: 11px; cursor: pointer; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #7c5cff, #4a9eff);
    transition: .2s; flex-shrink: 0;
  }
  .send-btn:disabled { background: #2a2a34; cursor: not-allowed; color: #555; }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,92,255,.35); }

  /* ===== Скроллбар ===== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e38; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3e3e4a; }

  /* ===== Модалка ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.9);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 40px; cursor: zoom-out;
  }
  .modal.open { display: flex; }
  .modal img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  /* ===== Мобильная адаптация ===== */
  @media (max-width: 720px) {
    .sidebar { width: 190px; }
    body.sidebar-hidden .sidebar { margin-left: -190px; }
    .msg { max-width: 90%; }
    .topbar { padding: 10px 12px; gap: 6px; }
    select { min-width: 140px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">AI Chat</div>
  <button class="new-chat" onclick="newChat()">+ Новый чат</button>
  <input id="chatSearch" class="search" placeholder="🔍 Поиск..." oninput="renderChats()" />
  <div class="chat-list" id="chatList"></div>
</div>

<div class="main">
  <div class="topbar">
    <button class="btn icon-only" onclick="toggleSidebar()" title="Скрыть/показать чаты">☰</button>
    <div class="group-model">
      <select id="modelSelect" title="Модель">
        <option value="">— загрузите модели —</option>
      </select>
      <button class="btn" onclick="loadModels()" title="Обновить">🔄</button>
    </div>
    <input id="customModel" placeholder="Своя модель..." />
    <button class="btn" onclick="addCustomModel()">+ Добавить</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="attach-preview" id="attachPreview"></div>
    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото">📎</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFiles(event)" />
      <textarea id="input" placeholder="Введите сообщение... (Enter — отправить, Shift+Enter — новая строка)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">Отправить</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" onclick="this.classList.remove('open')">
  <img id="modalImg" src="" />
</div>

<script>
// ======== ВШИТЫЕ НАСТРОЙКИ ========
const BASE_URL_RAW = 'https://shprotoness-ai.jq9gfk.workers.dev/v1';
const API_KEY = 'sk-cvc-2d42476d15cd8600d05962e0663c119f767fe86c39c560a9e61581dde6c66aa8';

// Если воркер отдаёт CORS — закомментируй строку с прокси и раскомментируй нижнюю:
const BASE_URL = 'https://corsproxy.io/?' + encodeURIComponent(BASE_URL_RAW);
// const BASE_URL = BASE_URL_RAW;

// ======== Состояние ========
const state = {
  chats: [],
  currentId: null,
  loading: false,
  attachments: []
};

// ======== Сохранение / загрузка ========
function save() {
  const cur = getCurrentChat();
  if (cur) cur.updatedAt = Date.now();
  localStorage.setItem('aiChats_v2', JSON.stringify(state.chats));
  localStorage.setItem('aiModel_v2', document.getElementById('modelSelect').value);
}

function loadState() {
  try {
    const c = JSON.parse(localStorage.getItem('aiChats_v2') || '[]');
    if (c.length) state.chats = c;
  } catch(e) {}
  if (!state.chats.length) newChat();
  else { state.currentId = state.chats[0].id; renderChats(); renderMessages(); }
}

// ======== Скрытие сайдбара ========
function toggleSidebar() {
  document.body.classList.toggle('sidebar-hidden');
  localStorage.setItem('sidebarHidden',
    document.body.classList.contains('sidebar-hidden') ? '1' : '0');
}
function restoreSidebar() {
  if (localStorage.getItem('sidebarHidden') === '1') {
    document.body.classList.add('sidebar-hidden');
  }
}

// ======== Чаты ========
function newChat() {
  const chat = {
    id: Date.now().toString(),
    title: 'Новый чат',
    model: document.getElementById('modelSelect')?.value || '',
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  state.chats.unshift(chat);
  state.currentId = chat.id;
  state.attachments = [];
  renderAttach();
  renderChats();
  renderMessages();
  save();
  setTimeout(() => document.getElementById('input')?.focus(), 50);
}

function switchChat(id) {
  state.currentId = id;
  state.attachments = [];
  renderAttach();
  const chat = getCurrentChat();
  if (chat?.model) {
    const sel = document.getElementById('modelSelect');
    if ([...sel.options].some(o => o.value === chat.model)) sel.value = chat.model;
  }
  renderChats();
  renderMessages();
}

function deleteChat(e, id) {
  e.stopPropagation();
  const chat = state.chats.find(c => c.id === id);
  if (!chat || !confirm(`Удалить "${chat.title}"?`)) return;
  state.chats = state.chats.filter(c => c.id !== id);
  if (state.currentId === id) state.currentId = state.chats[0]?.id || null;
  if (!state.chats.length) newChat();
  else { renderChats(); renderMessages(); }
  save();
}

function renameChat(e, id) {
  e.stopPropagation();
  const chat = state.chats.find(c => c.id === id);
  if (!chat) return;
  const item = document.querySelector(`.chat-item[data-id="${id}"]`);
  const titleEl = item?.querySelector('.t');
  if (!titleEl) return;

  const input = document.createElement('input');
  input.value = chat.title;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  const done = (saveIt) => {
    if (saveIt && input.value.trim()) chat.title = input.value.trim().slice(0, 50);
    save();
    renderChats();
  };
  input.addEventListener('blur', () => done(true), { once: true });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') input.blur();
    if (ev.key === 'Escape') { input.value = chat.title; input.blur(); }
  });
}

function getCurrentChat() {
  return state.chats.find(c => c.id === state.currentId);
}

function formatDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  if (diff === 1) return 'вчера';
  if (diff < 7) return d.toLocaleDateString('ru', { weekday: 'short' });
  return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderChats() {
  const list = document.getElementById('chatList');
  const q = (document.getElementById('chatSearch')?.value || '').trim().toLowerCase();

  let chats = [...state.chats]
    .filter(c => !q ||
      c.title.toLowerCase().includes(q) ||
      c.messages.some(m => (m.content || '').toLowerCase().includes(q)))
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  list.innerHTML = '';
  if (!chats.length) {
    list.innerHTML = `<div class="group">${q ? 'Ничего не найдено' : 'Нет чатов'}</div>`;
    return;
  }

  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const buckets = { 'Сегодня': [], 'Вчера': [], 'Раньше': [] };
  chats.forEach(c => {
    const t = c.updatedAt || c.createdAt || 0;
    if (t >= t0) buckets['Сегодня'].push(c);
    else if (t >= t0 - 86400000) buckets['Вчера'].push(c);
    else buckets['Раньше'].push(c);
  });

  Object.entries(buckets).forEach(([label, arr]) => {
    if (!arr.length) return;
    const g = document.createElement('div');
    g.className = 'group';
    g.textContent = label;
    list.appendChild(g);

    arr.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === state.currentId ? ' active' : '');
      item.dataset.id = c.id;
      item.onclick = () => switchChat(c.id);
      item.ondblclick = e => renameChat(e, c.id);
      item.innerHTML = `
        <span class="t">💬 ${escapeHtml(c.title)}</span>
        <button class="x" onclick="deleteChat(event, '${c.id}')" title="Удалить">×</button>
      `;
      list.appendChild(item);
    });
  });
}

function renderMessages() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  const chat = getCurrentChat();
  if (!chat || chat.messages.length === 0) {
    box.innerHTML = `<div class="empty">
      <div class="icon">✦</div>
      <h3>Чем помочь?</h3>
      <p>Начни диалог или прикрепи фото кнопкой 📎 — модель сможет его проанализировать.</p>
    </div>`;
    return;
  }
  chat.messages.forEach(m => appendMessage(m.role, m.content, m.imageUrl, m.attachments));
}

function appendMessage(role, content, imageUrl, attachments) {
  const box = document.getElementById('messages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;

  if (attachments && attachments.length) {
    const wrap = document.createElement('div');
    wrap.className = 'attached';
    attachments.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.onclick = e => { e.stopPropagation(); openModal(src); };
      wrap.appendChild(img);
    });
    div.appendChild(wrap);
  }

  if (content) {
    const t = document.createElement('div');
    t.textContent = content;
    div.appendChild(t);
  }

  if (imageUrl) {
    const img = document.createElement('img');
    img.src = imageUrl;
    img.onclick = e => { e.stopPropagation(); openModal(imageUrl); };
    div.appendChild(img);
  }

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function openModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('modal').classList.add('open');
}

// ======== Загрузка моделей ========
async function loadModels() {
  const select = document.getElementById('modelSelect');
  const prev = select.value;
  select.innerHTML = '<option>Загрузка...</option>';
  try {
    const res = await fetch(BASE_URL + '/models', {
      headers: { 'Authorization': 'Bearer ' + API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = (data.data || data.models || []).map(m => m.id || m.name).filter(Boolean);
    if (!models.length) throw new Error('пустой список');

    select.innerHTML = '';
    models.sort().forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      select.appendChild(opt);
    });
    const saved = localStorage.getItem('aiModel_v2');
    if (prev && models.includes(prev)) select.value = prev;
    else if (saved && models.includes(saved)) select.value = saved;
    save();
  } catch (e) {
    select.innerHTML = '<option value="">⚠️ ' + e.message + '</option>';
    console.error(e);
  }
}

// ======== Своя модель ========
function addCustomModel() {
  const inp = document.getElementById('customModel');
  const name = inp.value.trim();
  if (!name) return;
  const sel = document.getElementById('modelSelect');
  if (![...sel.options].some(o => o.value === name)) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name + '  (своя)';
    sel.appendChild(opt);
  }
  sel.value = name;
  inp.value = '';
  save();
}

// ======== Прикрепление файлов ========
function handleFiles(e) {
  const files = [...e.target.files];
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      state.attachments.push({ dataUrl: ev.target.result, name: f.name });
      renderAttach();
    };
    reader.readAsDataURL(f);
  });
  e.target.value = '';
}

function renderAttach() {
  const box = document.getElementById('attachPreview');
  box.innerHTML = '';
  state.attachments.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img src="${a.dataUrl}" /><button onclick="removeAttach(${i})">×</button>`;
    box.appendChild(d);
  });
}

f
